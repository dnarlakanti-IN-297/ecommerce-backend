apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: Backend Deploy

on:
  workflow_call:
    inputs:
      artifact-id:
        type: string
        required: true
        description: "Docker image tag (Git SHA) to deploy"
      environment:
        type: string
        required: true
        description: "Target environment (dev, staging, prod)"
      kubeconfig:
        type: string
        required: true
        description: "Kubernetes config for cluster access"
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: false

jobs:
  deploy-backend:
    env:
      IMAGE_TAG: ${{ inputs.artifact-id }}
      ENVIRONMENT: ${{ inputs.environment }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout infra repo
        uses: cloudbees-io/checkout@v1
        with:
          repository: dnarlakanti-IN-297/ecommerce-infra
          ref: main

      - name: Configure kubectl
        uses: docker://alpine:latest
        shell: sh
        run: |
          apk add --no-cache curl
          curl -LO "https://dl.k8s.io/release/v1.28.0/bin/linux/amd64/kubectl"
          chmod +x kubectl && mv kubectl /usr/local/bin/
          mkdir -p ~/.kube
          echo "$KUBECONFIG_BASE64" | base64 -d > ~/.kube/config
          kubectl cluster-info
        env:
          KUBECONFIG_BASE64: ${{ inputs.kubeconfig }}
          ENVIRONMENT: ${{ inputs.environment }}

      - name: Create namespace if not exists
        uses: docker://alpine:latest
        shell: sh
        run: |
          apk add --no-cache curl
          curl -LO "https://dl.k8s.io/release/v1.28.0/bin/linux/amd64/kubectl"
          chmod +x kubectl && mv kubectl /usr/local/bin/
          mkdir -p ~/.kube
          echo "$KUBECONFIG_BASE64" | base64 -d > ~/.kube/config

          case "$ENVIRONMENT" in
            dev) NAMESPACE="ecommerce-dev" ;;
            staging) NAMESPACE="ecommerce-staging" ;;
            prod) NAMESPACE="ecommerce-prod" ;;
            *) echo "❌ Unknown environment: $ENVIRONMENT"; exit 1 ;;
          esac

          echo "✅ Deploying backend to namespace: $NAMESPACE"
          kubectl get namespace $NAMESPACE || kubectl create namespace $NAMESPACE
          echo "✅ Namespace $NAMESPACE ready"
        env:
          KUBECONFIG_BASE64: ${{ inputs.kubeconfig }}
          ENVIRONMENT: ${{ inputs.environment }}

      - name: Cleanup old Helm releases
        uses: docker://alpine/helm:latest
        shell: sh
        run: |
          apk add --no-cache curl
          curl -LO "https://dl.k8s.io/release/v1.28.0/bin/linux/amd64/kubectl"
          chmod +x kubectl && mv kubectl /usr/local/bin/
          mkdir -p ~/.kube
          echo "$KUBECONFIG_BASE64" | base64 -d > ~/.kube/config

          case "$ENVIRONMENT" in
            dev) NAMESPACE="ecommerce-dev" ;;
            staging) NAMESPACE="ecommerce-staging" ;;
            prod) NAMESPACE="ecommerce-prod" ;;
          esac

          helm uninstall ecommerce -n $NAMESPACE 2>/dev/null || true
          kubectl delete secret -n $NAMESPACE -l owner=helm,name=ecommerce-backend 2>/dev/null || true
          echo "✅ Cleanup done"
        env:
          KUBECONFIG_BASE64: ${{ inputs.kubeconfig }}
          ENVIRONMENT: ${{ inputs.environment }}

      - name: Deploy backend with Helm
        uses: docker://alpine/helm:latest
        shell: sh
        run: |
          case "$ENVIRONMENT" in
            dev) NAMESPACE="ecommerce-dev" ;;
            staging) NAMESPACE="ecommerce-staging" ;;
            prod) NAMESPACE="ecommerce-prod" ;;
          esac

          echo "🚀 Deploying backend version: $IMAGE_TAG"
          echo "📍 Environment: $ENVIRONMENT"
          echo "📦 Namespace: $NAMESPACE"

          VALUES_FILE="helm/ecommerce-backend/values-${ENVIRONMENT}.yaml"
          if [ ! -f "$VALUES_FILE" ]; then
            VALUES_FILE="helm/ecommerce-backend/values.yaml"
          fi

          helm upgrade --install ecommerce-backend ./helm/ecommerce-backend \
            --namespace $NAMESPACE \
            --values $VALUES_FILE \
            --set image.repository=$DOCKERHUB_USERNAME/ecommerce-backend \
            --set image.tag=$IMAGE_TAG \
            --timeout 10m

          echo "✅ Backend deployment successful!"
        env:
          KUBECONFIG_BASE64: ${{ inputs.kubeconfig }}
          ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_TAG: ${{ inputs.artifact-id }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Verify backend deployment
        uses: docker://alpine:latest
        shell: sh
        run: |
          apk add --no-cache curl
          curl -LO "https://dl.k8s.io/release/v1.28.0/bin/linux/amd64/kubectl"
          chmod +x kubectl && mv kubectl /usr/local/bin/
          mkdir -p ~/.kube
          echo "$KUBECONFIG_BASE64" | base64 -d > ~/.kube/config

          case "$ENVIRONMENT" in
            dev) NAMESPACE="ecommerce-dev" ;;
            staging) NAMESPACE="ecommerce-staging" ;;
            prod) NAMESPACE="ecommerce-prod" ;;
          esac

          echo "📊 Checking backend pods..."
          kubectl get pods -n $NAMESPACE -l tier=backend

          kubectl rollout status deployment/ecommerce-backend -n $NAMESPACE --timeout=300s || {
            echo "❌ Deployment failed. Pod details:"
            kubectl describe pods -n $NAMESPACE -l tier=backend
            echo "--- Pod logs ---"
            kubectl logs -n $NAMESPACE -l tier=backend --tail=50
            exit 1
          }

          echo "✅ Backend is running!"
        env:
          KUBECONFIG_BASE64: ${{ inputs.kubeconfig }}
          ENVIRONMENT: ${{ inputs.environment }}

      - name: Test backend health
        uses: docker://alpine:latest
        shell: sh
        run: |
          apk add --no-cache curl
          curl -LO "https://dl.k8s.io/release/v1.28.0/bin/linux/amd64/kubectl"
          chmod +x kubectl && mv kubectl /usr/local/bin/
          mkdir -p ~/.kube
          echo "$KUBECONFIG_BASE64" | base64 -d > ~/.kube/config

          case "$ENVIRONMENT" in
            dev) NAMESPACE="ecommerce-dev" ;;
            staging) NAMESPACE="ecommerce-staging" ;;
            prod) NAMESPACE="ecommerce-prod" ;;
          esac

          BACKEND_POD=$(kubectl get pod -n $NAMESPACE -l app=ecommerce-backend -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n $NAMESPACE $BACKEND_POD -- python3 -c "import urllib.request; print(urllib.request.urlopen('http://localhost:5000/health').read().decode())"

          echo "✅ Backend health check complete!"
        env:
          KUBECONFIG_BASE64: ${{ inputs.kubeconfig }}
          ENVIRONMENT: ${{ inputs.environment }}
